# Render Blueprint: creates the web service and a free Postgres database in one go.
# (Render dashboard -> New -> Blueprint -> pick this repository.)
databases:
  - name: vivalavida-db
    plan: free
    databaseName: vivalavida
    user: vivalavida

services:
  - type: web
    name: vivalavida
    runtime: python
    plan: free
    buildCommand: "bash build.sh"
    startCommand: "gunicorn vivalavida.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: vivalavida-db
          property: connectionString
